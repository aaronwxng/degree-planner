<!doctype html><html lang="en"><meta charset="utf-8"><title>Planner browser checks</title>
<pre id="results">RUNNING</pre><iframe title="Planner under test" style="width:1200px;height:1000px;border:0"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),results=document.querySelector('#results');
const checks=[];
const assert=(condition,label)=>{if(!condition)throw Error(label);checks.push(label);};
const load=()=>new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
try{
 localStorage.removeItem('waterloo-degree-plan-v1');
 let loaded=load();frame.src='/index.html';await loaded;
 let doc=frame.contentDocument;
 assert(doc.querySelectorAll('.breadth-grid .audit-card').length===4,'Four breadth cards render');
 assert(doc.querySelector('#elective-summary').textContent.includes('Communication'),'Communication summary renders');
 const add=(code,{status='planned',grade='',exclude=false}={})=>{
  doc.querySelector('#add').click();const form=doc.querySelector('#course-form');
  form.elements.code.value=code;form.elements.status.value=status;form.elements.grade.value=grade;
  form.elements.excludeBreadthDepth.checked=exclude;form.requestSubmit();
  assert(!doc.querySelector('#editor').open,`Course editor saves ${code}`);
 };
 add('SCI 206');
 let science=[...doc.querySelectorAll('#breadth-progress .audit-card')].slice(2);
 assert(science.filter(c=>c.querySelector('.audit-badge').textContent==='Covered in plan').length===1,'SCI 206 covers exactly one science slot');
 assert(science.every(c=>c.querySelector('details').textContent.includes('SCI 206')),'SCI 206 is displayed as eligible in both science categories');
 add('PHYS 121');
 science=[...doc.querySelectorAll('#breadth-progress .audit-card')].slice(2);
 assert(science.every(c=>c.querySelector('.audit-badge').textContent==='Covered in plan'),'Two science courses cover both science categories');
 add('ENGL 109',{status:'completed'});add('ENGL 119',{status:'completed'});
 assert(doc.querySelector('#communication-progress').textContent.includes('Add a grade'),'Missing List I grade is surfaced');
 doc.querySelector('[data-edit="ENGL 109"]').click();doc.querySelector('#course-form').elements.grade.value='80';doc.querySelector('#course-form').requestSubmit();
 assert(doc.querySelector('#communication-progress .audit-badge').textContent==='Completed','Grade entry verifies completed communication pair');
 assert(doc.querySelector('#breadth-progress .audit-card .audit-units').textContent.startsWith('0.50'),'ENGL 109 is excluded from humanities while ENGL 119 counts');
 add('PSYCH 101');add('PSYCH 207');add('PSYCH 307');
 assert(doc.querySelector('#depth-progress .audit-badge').textContent==='Covered in plan','Projected 300-level depth renders');
 doc.querySelector('[data-edit="PSYCH 307"]').click();doc.querySelector('#course-form').elements.excludeBreadthDepth.checked=true;doc.querySelector('#course-form').requestSubmit();
 assert(doc.querySelector('#depth-progress .audit-badge').textContent==='Still needed','Content exclusion removes depth satisfaction');
 loaded=load();frame.contentWindow.location.reload();await loaded;doc=frame.contentDocument;
 assert(doc.querySelector('#communication-progress .audit-badge').textContent==='Completed','Grades and progress persist after reload');
 doc.querySelector('[data-edit="PSYCH 307"]').click();assert(doc.querySelector('#course-form').elements.excludeBreadthDepth.checked,'Exclusion persists after reload');doc.querySelector('#close').click();
 frame.style.width='390px';await new Promise(r=>setTimeout(r,100));
 assert(doc.documentElement.scrollWidth<=frame.clientWidth+2,'Mobile layout has no horizontal page overflow');
 assert(doc.querySelector('#breadth-progress').getBoundingClientRect().width<=390,'Mobile breadth cards fit viewport');
 frame.style.width='1200px';
 const waitFor=async(predicate,label)=>{for(let i=0;i<100;i++){if(predicate())return;await new Promise(r=>setTimeout(r,100));}throw Error(label);};
 const beforeImport=localStorage.getItem('waterloo-degree-plan-v1');
 doc.querySelector('#open-transcript').click();
 const blob=await (await fetch('/scripts/fixtures/transcript-synthetic.pdf')).blob();
 const transfer=new DataTransfer();transfer.items.add(new File([blob],'synthetic-transcript.pdf',{type:'application/pdf'}));
 doc.querySelector('#transcript-file').files=transfer.files;
 doc.querySelector('#transcript-file').dispatchEvent(new Event('change',{bubbles:true}));
 await waitFor(()=>doc.querySelectorAll('.transcript-table tbody tr').length===5,'PDF review did not become ready: '+doc.querySelector('#transcript-status').textContent);
 await waitFor(()=>!doc.querySelector('#apply-transcript').disabled,'PDF selection did not become importable');
 assert(doc.querySelectorAll('.transcript-table input:checked').length===3,'Local PDF extraction selects only three earned-credit courses');
 assert(doc.querySelectorAll('.transcript-table input:disabled').length===2,'Withdrawal and ungraded PDF rows remain blocked');
 assert(doc.querySelector('.transcript-table').textContent.includes('84.5'),'Decimal grade survives PDF extraction');
 assert(localStorage.getItem('waterloo-degree-plan-v1')===beforeImport,'PDF review does not mutate the plan');
 doc.querySelector('#close-transcript').click();
 assert(localStorage.getItem('waterloo-degree-plan-v1')===beforeImport,'Cancel leaves the existing plan unchanged');
 doc.querySelector('#open-transcript').click();
 doc.querySelector('#transcript-text').value='Private Name For Parser Test\nFall 2025\nCourse Description Attempted Earned Grade\nCS 135 Functional Programs 0.50 0.50 88\nECON 101 Microeconomics 0.50 0.00 WD';
 doc.querySelector('#parse-transcript').click();
 assert(doc.querySelectorAll('.transcript-table input:checked').length===1,'Pasted text also produces a review');
 doc.querySelector('#apply-transcript').click();
 const imported=JSON.parse(localStorage.getItem('waterloo-degree-plan-v1'));
 assert(imported.courses.find(c=>c.code==='CS 135').grade===88,'Applying transcript updates existing planned course grade');
 assert(imported.courses.some(c=>c.code==='CS 350'&&c.status==='planned'),'Applying transcript preserves future course plans');
 assert(!JSON.stringify(imported).includes('Private Name'),'Raw transcript identity text is not persisted');
 assert(doc.querySelector('#transcript-text').value==='','Closing import clears raw pasted text');
 doc.querySelector('#open-transcript').click();
 const invalid=new DataTransfer();invalid.items.add(new File(['not a PDF'],'invalid.pdf',{type:'application/pdf'}));
 doc.querySelector('#transcript-file').files=invalid.files;doc.querySelector('#transcript-file').dispatchEvent(new Event('change',{bubbles:true}));
 await waitFor(()=>doc.querySelector('#transcript-status').textContent.includes('not a PDF'),'Invalid PDF did not show an error');
 assert(doc.querySelector('#apply-transcript').disabled,'Invalid PDF cannot apply stale or empty records');doc.querySelector('#close-transcript').click();
 frame.style.width='390px';doc.querySelector('#open-transcript').click();
 assert(doc.querySelector('#transcript-dialog').getBoundingClientRect().width<=390,'Transcript dialog fits phone viewport');doc.querySelector('#close-transcript').click();
 results.textContent='PASS\n'+checks.join('\n');
}catch(error){results.textContent='FAIL\n'+error.stack;}
</script></html>
